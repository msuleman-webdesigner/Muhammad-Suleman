<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>M. Suleman Official</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #0b0f19;
      color: #ffffff;
      min-height: 100vh;
      overflow: hidden;
    }

    .typing-screen {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 1rem;
      background:
        radial-gradient(circle at center, rgba(255, 255, 255, 0.03), transparent 18%),
        #0b0f19;
    }

    .typing-text {
      font-family: 'Inter', sans-serif;
      font-size: clamp(1.8rem, 3vw, 3rem);
      font-weight: 600;
      letter-spacing: 0.04em;
      white-space: nowrap;
      text-align: center;
      color: #ffffff;
    }

    .typing-text::after {
      content: '';
      display: inline-block;
      width: 0.58em;
      height: 1em;
      background: #ffffff;
      margin-left: 0.12em;
      vertical-align: text-bottom;
      animation: blink 0.9s step-end infinite;
    }

    @keyframes blink {
      50% {
        opacity: 0;
      }
    }

    @media (max-width: 768px) {
      .typing-text {
        font-size: 1.35rem;
        letter-spacing: 0.02em;
      }
    }
  </style>
</head>
<body>
  <main class="typing-screen">
    <div id="typingText" class="typing-text"></div>
  </main>

  <script>
    const text = 'Welcome to M. Suleman Official';
    const typingElement = document.getElementById('typingText');
    let index = 0;

    function typeLetter() {
      if (index < text.length) {
        typingElement.textContent += text.charAt(index);
        index++;
        setTimeout(typeLetter, 60);
      }
    }

    typeLetter();
  </script>
</body>
</html>
